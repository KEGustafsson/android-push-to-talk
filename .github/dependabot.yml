# Keeps the two things this project depends on current: the Gradle/AndroidX dependencies and
# the pinned GitHub Actions. One pull request each per week at most; review like any other PR.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*", "com.google.android.material:*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
