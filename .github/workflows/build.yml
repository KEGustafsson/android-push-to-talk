name: Build

# Every push and pull request: the `build` job runs the unit tests and a release-type APK signed
# with the debug key, uploaded as a workflow artifact. It has a read-only token, no persisted
# credentials and no secrets, so pull-request Gradle code can reach nothing sensitive.
#
# Every push to main: the `release` job builds again with the crew's release key from the
# repository secrets and attaches CrewRadio-<version>.apk to a GitHub Release tagged v<version>.
# The version is the commit count on main (see app/build.gradle.kts), so nobody bumps numbers.
# Secrets: CREWRADIO_KEYSTORE_BASE64 (the .keystore file, base64), CREWRADIO_KEYSTORE_PASSWORD,
# CREWRADIO_KEY_ALIAS, CREWRADIO_KEY_PASSWORD; repository variable CREWRADIO_CERT_SHA256 (the
# release certificate's SHA-256, checked before anything is published). Without them the
# release job fails; it never publishes a debug-signed APK.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    # The Signal K plugin (sk-plugin/): pure Node, no dependencies, its own test runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Plugin tests
        working-directory: sk-plugin
        run: node --test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the version is the commit count
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Unit tests and APK (debug-signed)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          VERSION=$(./gradlew --no-daemon -q printVersion | tail -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "CrewRadio-$VERSION-debugsigned.apk"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CrewRadio-${{ env.VERSION }}-debugsigned
          path: CrewRadio-${{ env.VERSION }}-debugsigned.apk

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # build provenance attestation
      attestations: write
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWRADIO_KEYSTORE_BASE64 }}
      CREWRADIO_KEYSTORE_PASSWORD: ${{ secrets.CREWRADIO_KEYSTORE_PASSWORD }}
      CREWRADIO_KEY_ALIAS: ${{ secrets.CREWRADIO_KEY_ALIAS }}
      CREWRADIO_KEY_PASSWORD: ${{ secrets.CREWRADIO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Release keystore from secrets
        run: |
          # Fail closed: a Release is never published with the debug key.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$CREWRADIO_KEYSTORE_PASSWORD" ]; then
            echo "::error::CREWRADIO_KEYSTORE_BASE64 / CREWRADIO_KEYSTORE_PASSWORD secrets are not set; refusing to publish a release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CREWRADIO_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Signed release APK and SBOM
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease sbom
          VERSION=$(./gradlew --no-daemon -q printVersion | tail -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "CrewRadio-$VERSION.apk"
          cp app/build/reports/bom.json "CrewRadio-$VERSION.sbom.cdx.json"
          sha256sum "CrewRadio-$VERSION.apk" > "CrewRadio-$VERSION.apk.sha256"

      - name: Verify the APK is signed with the release certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.CREWRADIO_CERT_SHA256 }}
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: ${APKSIGNER:-not found under $SDK/build-tools}"
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
          CERTS=$("$APKSIGNER" verify --print-certs "CrewRadio-$VERSION.apk" 2>&1) || { echo "$CERTS"; echo "::error::apksigner verify failed"; exit 1; }
          echo "$CERTS" | grep -i "certificate SHA-256 digest"
          # apksigner labels the line "Signer #1 certificate SHA-256 digest:" or, from build-tools 37, "V2 Signer: certificate SHA-256 digest:"
          ACTUAL=$(echo "$CERTS" | grep -i "certificate SHA-256 digest" | head -1 | sed 's/.*digest: *//' | tr -d '[:space:]' | tr 'A-F' 'a-f')
          echo "signer certificate sha256: $ACTUAL"
          if [ -z "$EXPECTED_CERT_SHA256" ]; then echo "::error::repository variable CREWRADIO_CERT_SHA256 is not set"; exit 1; fi
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then echo "::error::APK is not signed with the crew's release certificate"; exit 1; fi

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: CrewRadio-${{ env.VERSION }}.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: Crew Radio ${{ env.VERSION }}
          body: |
            Built from ${{ github.sha }}. Every phone on the crew must run the same version.
            Install: open this page on the phone, download the APK, allow the install.
            The .sha256 file is the APK's checksum, the .sbom.cdx.json its software bill of
            materials (CycloneDX), and the build carries a signed provenance attestation
            (`gh attestation verify CrewRadio-<version>.apk --repo KEGustafsson/android-push-to-talk`).
          files: |
            CrewRadio-${{ env.VERSION }}.apk
            CrewRadio-${{ env.VERSION }}.apk.sha256
            CrewRadio-${{ env.VERSION }}.sbom.cdx.json
