name: Build

# Every push and pull request: unit tests and a release APK as a workflow artifact.
# Every push to main: the same APK attached to a GitHub Release tagged v<version>, so a phone
# can install it from the Releases page. The version is the commit count on main (see
# app/build.gradle.kts), so nobody bumps numbers by hand.
#
# Signing: with the secrets below the APK is signed with the crew's release key; without them
# it is signed with the debug key, which still installs but cannot upgrade a release-signed
# app in place (and vice versa). Secrets: CREWRADIO_KEYSTORE_BASE64 (the .keystore file,
# base64), CREWRADIO_KEYSTORE_PASSWORD, CREWRADIO_KEY_ALIAS, CREWRADIO_KEY_PASSWORD.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the version is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release keystore from secrets
        if: ${{ secrets.CREWRADIO_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.CREWRADIO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CREWRADIO_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests and release APK
        env:
          CREWRADIO_KEYSTORE_PASSWORD: ${{ secrets.CREWRADIO_KEYSTORE_PASSWORD }}
          CREWRADIO_KEY_ALIAS: ${{ secrets.CREWRADIO_KEY_ALIAS }}
          CREWRADIO_KEY_PASSWORD: ${{ secrets.CREWRADIO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          VERSION=$(./gradlew --no-daemon -q printVersion | tail -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "CrewRadio-$VERSION.apk"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: CrewRadio-${{ env.VERSION }}
          path: CrewRadio-${{ env.VERSION }}.apk

      - name: GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Crew Radio ${{ env.VERSION }}
          body: |
            Built from ${{ github.sha }}. Every phone on the crew must run the same version.
            Install: open this page on the phone, download the APK, allow the install.
          files: CrewRadio-${{ env.VERSION }}.apk
